name: Symptum Editor Linux AppImage Packaging

on:
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]
  workflow_dispatch:

env:
  ICON_PATH: 'main/src/Symptum.Editor/Assets/Images/Symptum_Editor.png'

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        path: main
    - name: Checkout Symptum.Data
      uses: actions/checkout@v7
      with:
        repository: symptum/Symptum.Data
        path: Symptum.Data
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore Workloads
      run: dotnet workload restore ./main/src/Symptum.Editor/Symptum.Editor.csproj
    - name: Publish
      run: dotnet publish ./main/src/Symptum.Editor/Symptum.Editor.csproj -f net10.0-desktop -c Release -r linux-x64 -p:UseMonoRuntime=false --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o ./publish
    - name: Structure AppDir for AppImage
      run: |
        # Create standard AppDir structure
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/share/applications
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
        
        # Copy the published self-contained application
        cp -r ./publish/* AppDir/usr/bin/
        
        # Create the AppRun entry point script
        cat << 'EOF' > AppDir/AppRun
        #!/bin/sh
        HERE="$(dirname "$(readlink -f "${0}")")"
        exec "$HERE/usr/bin/Symptum.Editor" "$@"
        EOF
        chmod +x AppDir/AppRun

        # Create the Desktop entry file at the root of AppDir
        cat << EOF > AppDir/symptum-editor.desktop
        [Desktop Entry]
        Type=Application
        Name=Symptum Editor (Dev)
        Exec=Symptum.Editor
        Icon=symptum-editor
        Categories=Utility;
        Terminal=false
        EOF
        
        # Copy desktop entry to usr/share/applications/ as well
        cp AppDir/symptum-editor.desktop AppDir/usr/share/applications/

        if [ -f "${{ env.ICON_PATH }}" ]; then
          cp "${{ env.ICON_PATH }}" AppDir/symptum-editor.png
          cp "${{ env.ICON_PATH }}" AppDir/usr/share/icons/hicolor/256x256/apps/symptum-editor.png
        fi

    - name: Download and Configure appimagetool
      run: |
        wget -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool

    - name: Build AppImage
      run: |
        # Extract and run avoids standard FUSE container limitations in GitHub Actions
        ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir Symptum-Editor-x86_64.AppImage

    - name: Upload AppImage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Symptum-Editor-Linux-AppImage
        path: Symptum-Editor-x86_64.AppImage
        if-no-files-found: error
